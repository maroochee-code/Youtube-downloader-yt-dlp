<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT 다운로더</title>
<style>
:root{--bg:#f4f4f1;--panel:#fff;--side:#f1efe8;--text:#1f1f1d;--sub:#5f5e5a;--mute:#8a8984;--line:#dcdad2;--accent:#185fa5;--on:#fff;--danger:#a32d2d;--ok:#3b6d11;--soft:#e6f1fb}
:root[data-theme=dark]{--bg:#1b1b1a;--panel:#242422;--side:#20201f;--text:#ecebe6;--sub:#b4b2a9;--mute:#888780;--line:#3a3a37;--accent:#85b7eb;--on:#042c53;--danger:#f09595;--ok:#97c459;--soft:#0c2a45;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme=system]{--bg:#1b1b1a;--panel:#242422;--side:#20201f;--text:#ecebe6;--sub:#b4b2a9;--mute:#888780;--line:#3a3a37;--accent:#85b7eb;--on:#042c53;--danger:#f09595;--ok:#97c459;--soft:#0c2a45;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--sub)}
button.primary{background:var(--accent);color:var(--on);border-color:transparent}
button.ico{border:none;background:transparent;font-size:18px;padding:2px 8px;color:var(--sub)}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-weight:500;color:var(--sub);font-size:13px}
.menu{position:relative}
.dropdown{position:absolute;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:190px;z-index:10;padding:4px;display:none}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:left;border:none;background:transparent;border-radius:6px}
.dropdown button:hover{background:var(--soft)}
.upd{padding:8px 14px;background:var(--soft);color:var(--accent);align-items:center;gap:10px;font-size:13px;border-bottom:1px solid var(--line)}
.addr{background:var(--panel);padding:12px 14px 4px;border-bottom:1px solid var(--line)}
.addrbox{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
.addrbox:focus-within{border-color:var(--accent)}
#url{flex:1;border:none;outline:none;resize:none;background:transparent;font-size:16px;line-height:1.5;word-break:break-all;overflow:hidden;min-height:24px;max-height:140px;overflow-y:auto}
.actions{display:flex;gap:10px;align-items:center;margin:10px 0}
.actions .hint{margin-left:auto;color:var(--mute);font-size:12px}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:0}
main{padding:14px;overflow-y:auto}
aside{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h3{margin:0;padding:12px 14px 6px;font-size:13px;font-weight:500;color:var(--sub);display:flex;justify-content:space-between}
#lib{flex:1;overflow-y:auto;padding:0 8px}
.item{display:flex;gap:8px;padding:6px;border-radius:8px;cursor:pointer;align-items:center}
.item:hover,.item.on{background:var(--soft)}
.item img,.item .ph{width:64px;height:38px;object-fit:cover;border-radius:4px;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute)}
.item .t{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.item .m{font-size:11px;color:var(--mute)}
.item .rv{margin-left:auto;visibility:hidden;font-size:12px;padding:2px 4px}
.item:hover .rv{visibility:visible}
.folder{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--sub)}
.folder div{word-break:break-all;margin-bottom:6px}
#player{aspect-ratio:16/9;max-height:46vh;width:100%;border:1px dashed var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden;position:relative}
#player iframe,#player video{width:100%;height:100%;border:0;background:#000}
#player img{width:100%;height:100%;object-fit:contain}
#player audio{width:90%}
.info{margin:10px 0}
.info .ti{font-size:16px;font-weight:500}
.info .su{color:var(--sub);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--accent);margin-left:6px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:6px 14px;cursor:pointer;background:var(--panel)}
.seg input{display:none}
.seg input:checked+span{font-weight:600;color:var(--accent)}
.seg label:has(input:checked){background:var(--soft)}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:8px}
summary{padding:8px 12px;cursor:pointer;color:var(--sub)}
.adv{padding:4px 14px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.adv fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.adv legend{font-size:12px;color:var(--sub);padding:0 6px}
.adv label{display:flex;gap:6px;align-items:center;margin:4px 0}
.adv input[type=text]{width:100px}
#pl{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:240px;overflow-y:auto;display:none}
#pl .h{position:sticky;top:0;background:var(--panel);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#pl label{display:flex;gap:8px;align-items:center;padding:4px 12px;font-size:13px}
.msg{margin:8px 0;font-size:13px;color:var(--sub);min-height:18px}
.msg.err{color:var(--danger)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;font-size:12px;color:var(--sub)}
.job{display:flex;gap:10px;align-items:center;margin:2px 0}
.job .n{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
.job.error .n,.job.error .s{color:var(--danger)}
.job.done .s{color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500}
dialog .db{padding:14px 16px;max-height:62vh;overflow-y:auto}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.f{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center}
.f input[type=text],.f select,.f input[type=number]{width:100%}
.site{padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.site span{color:var(--mute);margin-left:8px;font-size:12px}
@media (max-width:820px){.body{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <b>YT 다운로더</b>
  <span style="display:flex;align-items:center">
    <button class="ico" id="btnSettings" title="설정">⚙</button>
    <span class="menu">
      <button class="ico" id="btnMenu" title="메뉴">⋮</button>
      <div class="dropdown" id="dd">
        <button id="mSites">지원 사이트 목록</button>
        <button id="mFolder">다운로드 폴더 열기</button>
        <button id="mUpdate">yt-dlp 업데이트 확인</button>
        <button id="mAbout">정보</button>
        <button id="mQuit">프로그램 종료</button>
      </div>
    </span>
  </span>
</header>

<div id="upd" class="upd" style="display:none"></div>

<section class="addr">
  <div class="addrbox">
    <span style="color:var(--accent);font-size:18px">🔗&#xFE0E;</span>
    <textarea id="url" rows="1" spellcheck="false" placeholder="영상 주소를 붙여넣으세요 (예: https://www.youtube.com/watch?v=...)"></textarea>
    <button class="ico" id="clear" title="지우기">✕</button>
  </div>
  <div class="actions">
    <button id="btnPreview">미리보기</button>
    <button id="btnDl" class="primary">다운로드</button>
    <span class="hint">주소를 붙여넣으면 영상 / 플레이리스트 / 라이브를 자동으로 인식합니다</span>
  </div>
</section>

<div class="body">
  <main>
    <div id="player">미리보기 플레이어</div>
    <div class="info" id="info"></div>
    <div class="msg" id="msg"></div>

    <div class="opts">
      <span class="seg">
        <label><input type="radio" name="mode" value="video" checked><span>영상</span></label>
        <label><input type="radio" name="mode" value="audio"><span>음원</span></label>
      </span>
      <select id="height" title="해상도"></select>
      <select id="vfmt"><option>mp4</option><option>mkv</option><option>webm</option></select>
      <select id="afmt" style="display:none"><option>mp3</option><option>m4a</option><option>opus</option><option>flac</option></select>
      <select id="preset" title="프리셋">
        <option value="">프리셋: 기본</option>
        <option value="music">음악 (mp3 · 썸네일 · 태그)</option>
        <option value="lecture">강의 (720p · 자막 포함)</option>
        <option value="best">최고화질 (mkv)</option>
      </select>
    </div>

    <div id="pl"></div>

    <details>
      <summary>고급 옵션 (자막 · 구간 · 변환 · SponsorBlock)</summary>
      <div class="adv">
        <fieldset><legend>자막</legend>
          <label><input type="checkbox" id="subs"> 자막 받기 (업로드 + 자동 생성)</label>
          <label>언어 <input type="text" id="subLangs" value="ko,en"></label>
          <label><input type="checkbox" id="subEmbed" checked> 영상에 내장</label>
        </fieldset>
        <fieldset><legend>구간 다운로드</legend>
          <label>시작 <input type="text" id="start" placeholder="01:20"></label>
          <label>끝 <input type="text" id="end" placeholder="03:45"></label>
          <span class="su" style="font-size:12px;color:var(--mute)">비워두면 전체</span>
        </fieldset>
        <fieldset><legend>내장 · 기타</legend>
          <label><input type="checkbox" id="embThumb" checked> 썸네일 내장 (앨범아트)</label>
          <label><input type="checkbox" id="embMeta" checked> 메타데이터 · 챕터 내장</label>
          <label><input type="checkbox" id="sb"> SponsorBlock (스폰서 구간 제거)</label>
        </fieldset>
      </div>
    </details>
  </main>

  <aside>
    <h3>저장한 영상 <button class="ico" id="refresh" title="새로고침" style="font-size:14px;padding:0 4px">↻</button></h3>
    <div id="lib"></div>
    <div class="folder">
      <div id="dir">-</div>
      <button id="btnDir">폴더 변경</button>
    </div>
  </aside>
</div>

<footer id="jobs">대기 중</footer>

<dialog id="dlgSettings">
  <div class="dh">설정 <button class="ico" data-close>✕</button></div>
  <div class="db"><div class="f">
    <label>다운로드 폴더</label><input type="text" id="sDir">
    <label>파일명 템플릿</label><input type="text" id="sTmpl">
    <label>속도 제한</label><input type="text" id="sRate" placeholder="예: 2M (비우면 무제한)">
    <label>재시도 횟수</label><input type="number" id="sRetry" min="0">
    <label>쿠키 (로그인)</label>
    <select id="sCookie"><option value="">사용 안 함</option><option>chrome</option><option>edge</option><option>firefox</option><option>brave</option></select>
    <label>프록시</label><input type="text" id="sProxy" placeholder="http://host:port">
    <label>화면 테마</label>
    <select id="sTheme"><option value="dark">어둡게</option><option value="light">밝게</option><option value="system">시스템 설정 따라가기</option></select>
    <label>중복 방지</label><label><input type="checkbox" id="sArchive"> 이미 받은 영상은 건너뛰기</label>
  </div>
  <p id="sErr" class="msg err"></p></div>
  <div class="df"><button data-close>취소</button><button class="primary" id="sSave">저장</button></div>
</dialog>

<dialog id="dlgSites">
  <div class="dh">지원 사이트 <button class="ico" data-close>✕</button></div>
  <div class="db">
    <input type="text" id="siteQ" placeholder="사이트 이름 검색" style="width:100%;margin-bottom:8px">
    <div class="su" id="siteCount" style="font-size:12px;color:var(--mute);margin-bottom:6px"></div>
    <div id="siteList"></div>
    <p style="font-size:12px;color:var(--mute)">목록에 있어도 로그인이 필요하거나 DRM이 걸린 영상은 받을 수 없습니다.</p>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let info = null, infoUrl = '', wantHeight = 1080, playlistAll = false, sitesData = null, playingName = '';

async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .catch(() => { throw new Error('프로그램(서버)과 연결되지 않았습니다. run.bat 창이 켜져 있는지 확인하고, 꺼졌다면 다시 실행하세요.'); });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : '요청에 실패했습니다.');
  return j;
}
const fmtDur = s => { if (!s) return ''; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : b > 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.round(b/1e3)+' KB';
function msg(t, err) { const m = $('#msg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); }
const mode = () => document.querySelector('input[name=mode]:checked').value;

/* 주소창 */
const url = $('#url');
function grow() { url.style.height = 'auto'; url.style.height = Math.min(url.scrollHeight, 140) + 'px'; }
url.addEventListener('input', grow);
url.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.ctrlKey ? download() : preview(); } });
url.addEventListener('paste', () => setTimeout(() => { grow(); preview(); }, 50));
$('#clear').onclick = () => { url.value = ''; grow(); url.focus(); };
document.addEventListener('keydown', e => { if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); url.focus(); url.select(); } });

/* 옵션 UI */
function fillHeights(list) {
  const sel = $('#height'); const hs = list && list.length ? list : [2160, 1440, 1080, 720, 480, 360];
  sel.innerHTML = '<option value="0">최고화질</option>' + hs.map(h => `<option value="${h}">${h}p</option>`).join('');
  const pick = hs.find(h => h <= wantHeight) ?? hs[hs.length - 1];
  sel.value = wantHeight === 0 ? '0' : String(pick);
}
function syncMode() {
  const a = mode() === 'audio';
  $('#height').style.display = $('#vfmt').style.display = a ? 'none' : '';
  $('#afmt').style.display = a ? '' : 'none';
}
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = syncMode);
$('#height').onchange = e => wantHeight = +e.target.value;
$('#preset').onchange = e => {
  const v = e.target.value;
  const set = (m, h, vf, af, sub, thumb) => {
    document.querySelector(`input[name=mode][value=${m}]`).checked = true;
    wantHeight = h; $('#vfmt').value = vf; $('#afmt').value = af; $('#subs').checked = sub; $('#embThumb').checked = thumb;
    fillHeights(info && info.heights); syncMode();
  };
  if (v === 'music') set('audio', 1080, 'mp4', 'mp3', false, true);
  else if (v === 'lecture') set('video', 720, 'mp4', 'mp3', true, true);
  else if (v === 'best') set('video', 0, 'mkv', 'mp3', false, true);
  else set('video', 1080, 'mp4', 'mp3', false, true);
};

/* 미리보기 */
function setPlayer(html) { $('#player').innerHTML = html; }
async function preview() {
  const u = url.value.trim(); if (!u) return;
  msg('정보를 불러오는 중…'); $('#btnPreview').disabled = true;
  try {
    info = await api('/api/info', {url: u, playlist: playlistAll}); infoUrl = u; playlistAll = false;
    renderInfo(); msg('');
  } catch (e) { info = null; msg(e.message, true); }
  $('#btnPreview').disabled = false;
}
function renderInfo() {
  playingName = ''; document.querySelectorAll('#lib .item').forEach(i => i.classList.remove('on'));
  const i = info, pl = $('#pl');
  if (i.type === 'playlist') {
    setPlayer(i.thumb ? `<img src="${esc(i.thumb)}">` : '플레이리스트');
    $('#info').innerHTML = `<div class="ti">${esc(i.title)}<span class="badge">플레이리스트 ${i.entries.length}개</span></div><div class="su">${esc(i.uploader || '')}</div>`;
    fillHeights(null);
    pl.style.display = 'block';
    pl.innerHTML = `<div class="h"><label style="padding:0"><input type="checkbox" id="plAllChk" checked> 전체 선택</label></div>` +
      i.entries.map(e => `<label><input type="checkbox" class="plc" value="${e.index}" checked> ${e.index}. ${esc(e.title)} <span class="su">${fmtDur(e.duration)}</span></label>`).join('');
    $('#plAllChk').onchange = ev => document.querySelectorAll('.plc').forEach(c => c.checked = ev.target.checked);
  } else {
    pl.style.display = 'none'; pl.innerHTML = '';
    if (i.embed) setPlayer(`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(i.embed)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`);
    else setPlayer((i.thumb ? `<img src="${esc(i.thumb)}">` : '') +
      `<div style="position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px">이 영상은 업로더가 미리보기(임베드)를 막아 두었습니다. 다운로드는 가능합니다.</div>`);
    $('#info').innerHTML = `<div class="ti">${esc(i.title)}${i.is_live ? '<span class="badge">라이브</span>' : ''}</div>
      <div class="su">${esc(i.uploader || '')} ${i.duration ? '· ' + fmtDur(i.duration) : ''} ${i.has_list ? '· <a href="#" id="plLink">플레이리스트로 받기</a>' : ''}</div>`;
    fillHeights(i.heights);
    const l = $('#plLink'); if (l) l.onclick = ev => { ev.preventDefault(); playlistAll = true; preview(); };
  }
  $('#btnDl').textContent = info.is_live ? '녹화 시작' : '다운로드';
}

/* 다운로드 */
async function download() {
  const u = url.value.trim(); if (!u) { msg('주소를 입력하세요.', true); return; }
  if (!info || infoUrl !== u) { await preview(); if (!info) return; }
  const isPl = info.type === 'playlist';
  const body = {url: u, mode: mode(), height: +$('#height').value || 0, vformat: $('#vfmt').value, aformat: $('#afmt').value,
    playlist: isPl, items: isPl ? [...document.querySelectorAll('.plc:checked')].map(c => +c.value) : [],
    subs: $('#subs').checked, sub_langs: $('#subLangs').value, sub_embed: $('#subEmbed').checked,
    start: $('#start').value, end: $('#end').value, embed_meta: $('#embMeta').checked,
    embed_thumb: $('#embThumb').checked, sponsorblock: $('#sb').checked};
  try { await api('/api/download', body); msg('다운로드를 시작했습니다.'); pollJobs(); }
  catch (e) { msg(e.message, true); }
}
$('#btnPreview').onclick = preview;
$('#btnDl').onclick = download;

/* 진행률 */
let pollTimer = null, hadActive = false;
const hinted = new Set();
const stageName = {FFmpegExtractAudio: '음원 변환', Merger: '영상·음성 병합', FFmpegMerger: '영상·음성 병합', EmbedThumbnail: '썸네일 내장', FFmpegMetadata: '메타데이터 내장', FFmpegEmbedSubtitle: '자막 내장', ModifyChapters: '구간 편집', SponsorBlock: 'SponsorBlock'};
async function pollJobs() {
  clearTimeout(pollTimer);
  let js = [];
  try { js = await api('/api/jobs'); } catch (e) {}
  const active = js.some(j => ['starting', 'downloading', 'processing'].includes(j.status));
  const now = Date.now() / 1000;
  const show = js.filter(j => ['starting', 'downloading', 'processing'].includes(j.status) || (j.finished && now - j.finished < 20));
  $('#jobs').innerHTML = show.length ? show.map(j => {
    let s;
    if (j.status === 'downloading') s = `${j.percent}% · ${j.speed ? fmtSize(j.speed) + '/s' : ''} ${j.eta != null ? '· 남은 ' + fmtDur(j.eta) : ''}`;
    else if (j.status === 'processing') s = stageName[j.stage] || '처리 중…';
    else if (j.status === 'done') s = '완료';
    else if (j.status === 'cancelled') s = '취소됨';
    else if (j.status === 'error') s = j.error;
    else s = '준비 중…';
    const idx = j.total ? `[${j.index}/${j.total}] ` : '';
    const cancel = active && ['starting', 'downloading', 'processing'].includes(j.status) ? `<button class="ico" style="font-size:13px" onclick="api('/api/jobs/${j.id}/cancel',{})" title="취소">✕</button>` : '';
    return `<div class="job ${j.status}"><span class="n">${esc(idx + j.title)}</span><span class="bar"><i style="width:${j.percent}%"></i></span><span class="s" style="flex:0 0 32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s)}">${esc(s)}</span>${cancel}</div>`;
  }).join('') : '대기 중';
  js.filter(j => j.status === 'error' && !hinted.has(j.id)).forEach(j => {
    hinted.add(j.id);
    msg('다운로드에 실패했습니다. 계속 실패하면 yt-dlp가 오래되었을 수 있습니다. 메뉴(⋮)의 "yt-dlp 업데이트 확인"을 눌러 보세요.', true);
    checkUpdate(false);
  });
  if (hadActive && !active) loadLib();
  hadActive = active;
  if (active || show.length) pollTimer = setTimeout(pollJobs, active ? 800 : 3000);
}

/* 저장 목록 */
async function loadLib() {
  try {
    const d = await api('/api/library');
    $('#dir').textContent = d.dir;
    $('#lib').innerHTML = d.items.length ? d.items.map(it => `
      <div class="item ${it.name === playingName ? 'on' : ''}" data-name="${esc(it.name)}" data-audio="${it.audio}">
        ${it.thumb ? `<img loading="lazy" src="/api/file?name=${encodeURIComponent(it.thumb)}">` : `<div class="ph">${it.audio ? '음원' : '영상'}</div>`}
        <div style="min-width:0"><div class="t">${esc(it.title)}</div><div class="m">${it.ext} · ${fmtSize(it.size)}</div></div>
        <button class="ico rv" data-reveal title="폴더에서 보기">📂&#xFE0E;</button>
      </div>`).join('') : '<div class="m" style="padding:10px;color:var(--mute);font-size:12px">저장된 영상이 없습니다.</div>';
  } catch (e) { msg(e.message, true); }
}
$('#lib').addEventListener('click', async e => {
  const it = e.target.closest('.item'); if (!it) return;
  const name = it.dataset.name;
  if (e.target.closest('[data-reveal]')) { api('/api/reveal', {name}).catch(x => msg(x.message, true)); return; }
  playingName = name;
  const src = '/api/file?name=' + encodeURIComponent(name);
  setPlayer(it.dataset.audio === 'true' ? `<audio controls autoplay src="${src}"></audio>` : `<video controls autoplay src="${src}"></video>`);
  $('#info').innerHTML = `<div class="ti">${esc(it.querySelector('.t').textContent)}</div><div class="su">저장된 파일 재생 중</div>`;
  document.querySelectorAll('#lib .item').forEach(i => i.classList.toggle('on', i === it));
});
$('#refresh').onclick = loadLib;
$('#btnDir').onclick = async () => { try { await api('/api/pick-folder', {}); loadLib(); } catch (e) { msg(e.message, true); } };

/* 메뉴 / 대화상자 */
const dd = $('#dd');
$('#btnMenu').onclick = e => { e.stopPropagation(); dd.classList.toggle('open'); };
document.addEventListener('click', () => dd.classList.remove('open'));
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

$('#btnSettings').onclick = async () => {
  const s = await api('/api/settings');
  $('#sDir').value = s.download_dir; $('#sTmpl').value = s.outtmpl; $('#sRate').value = s.rate_limit; $('#sRetry').value = s.retries;
  $('#sCookie').value = s.cookies_browser; $('#sProxy').value = s.proxy; $('#sArchive').checked = s.use_archive;
  $('#sTheme').value = s.theme || 'dark';
  $('#sErr').textContent = ''; $('#dlgSettings').showModal();
};
$('#sSave').onclick = async () => {
  try {
    await api('/api/settings', {download_dir: $('#sDir').value.trim(), outtmpl: $('#sTmpl').value.trim(), rate_limit: $('#sRate').value.trim(),
      retries: $('#sRetry').value, cookies_browser: $('#sCookie').value, proxy: $('#sProxy').value.trim(), use_archive: $('#sArchive').checked,
      theme: $('#sTheme').value});
    document.documentElement.dataset.theme = $('#sTheme').value;
    $('#dlgSettings').close(); loadLib();
  } catch (e) { $('#sErr').textContent = e.message; }
};

function renderSites() {
  const q = $('#siteQ').value.trim().toLowerCase();
  const list = sitesData.filter(s => !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
  $('#siteCount').textContent = `${list.length} / ${sitesData.length}개` + (list.length > 400 ? ' (검색으로 좁혀보세요)' : '');
  $('#siteList').innerHTML = list.slice(0, 400).map(s => `<div class="site">${esc(s.name)}<span>${esc(s.desc)}</span></div>`).join('');
}
$('#mSites').onclick = async () => {
  $('#dlgSites').showModal();
  if (!sitesData) { $('#siteCount').textContent = '불러오는 중…'; sitesData = await api('/api/extractors'); }
  renderSites();
};
$('#siteQ').oninput = () => sitesData && renderSites();
$('#mFolder').onclick = () => api('/api/open-folder', {});
$('#mAbout').onclick = async () => { const a = await api('/api/about'); msg(`yt-dlp ${a.yt_dlp} · ffmpeg ${a.ffmpeg ? '사용 가능' : '없음 (병합·변환 불가)'}`); };
function updBar(html, binds) {
  const b = $('#upd'); b.style.display = html ? 'flex' : 'none'; b.innerHTML = html || '';
  for (const [id, fn] of Object.entries(binds || {})) { const el = document.getElementById(id); if (el) el.onclick = fn; }
}
async function checkUpdate(manual) {
  if (manual) msg('yt-dlp 버전을 확인하는 중…');
  try {
    const r = await api('/api/update-check');
    if (r.outdated) {
      if (manual) msg('');
      updBar(`<span style="flex:1">yt-dlp 새 버전 ${esc(r.latest)}이(가) 있습니다 (현재 ${esc(r.current)}). 유튜브 변경으로 다운로드가 안 될 때 업데이트하면 해결되는 경우가 많습니다.</span>
        <button class="primary" id="uNow">지금 업데이트</button><button id="uLater">나중에</button>`,
        {uNow: doUpdate, uLater: () => updBar('')});
    } else if (manual) {
      msg(r.latest ? `yt-dlp가 최신 버전입니다 (${r.current}).` : '업데이트를 확인하지 못했습니다. 인터넷 연결을 확인하세요.', !r.latest);
    }
  } catch (e) { if (manual) msg(e.message, true); }
}
async function doUpdate() {
  updBar('<span>yt-dlp를 업데이트하는 중입니다. 잠시만 기다려 주세요…</span>');
  try {
    const r = await api('/api/update', {});
    if (r.ok) updBar(`<span style="flex:1">업데이트 완료${r.version ? ' (' + esc(r.version) + ')' : ''}. 다시 시작하면 적용됩니다.</span><button class="primary" id="uRe">다시 시작</button>`, {uRe: restartApp});
    else updBar(`<span style="flex:1">업데이트에 실패했습니다. ${esc(r.log)}</span><button id="uLater">닫기</button>`, {uLater: () => updBar('')});
  } catch (e) { updBar(`<span style="flex:1">${esc(e.message)}</span><button id="uLater">닫기</button>`, {uLater: () => updBar('')}); }
}
async function restartApp() {
  try {
    await api('/api/restart', {});
    document.body.innerHTML = '<p style="padding:30px">다시 시작하는 중입니다. 창이 잠시 후 다시 열립니다…</p>';
  } catch (e) { msg(e.message, true); }
}
$('#mUpdate').onclick = () => checkUpdate(true);
$('#mQuit').onclick = () => { api('/api/quit', {}).finally(() => { document.body.innerHTML = '<p style="padding:30px">프로그램을 종료했습니다. 이 창을 닫아도 됩니다.</p>'; }); };

api('/api/settings').then(s => document.documentElement.dataset.theme = s.theme || 'dark').catch(() => {});
fillHeights(null); syncMode(); loadLib(); pollJobs(); url.focus(); checkUpdate(false);
</script>
</body>
</html>
